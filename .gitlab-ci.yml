image: maven:3.6-jdk-11

before_script:
  - hostname
  - whoami
  - env

variables:
  MAVEN_CLI_OPTS: "--batch-mode"

stages:
  - test
  - report
  - package
  - publish

test:
  stage: test
  only:
    - merge_requests
    - develop
    - master
    - release/accelerator
  script:
    - mvn clean test -e $MAVEN_CLI_OPTS
  artifacts:
    paths:
      - ./target/site/jacoco/jacoco.xml
    reports:
      junit:
        - ./target/surefire-reports/TEST-*.xml

report-coverage:
  stage: report
  image: haynes/jacoco2cobertura:1.0.4
  only:
    - merge_requests
    - develop
    - master
    - release/accelerator
  needs:
    - test
  dependencies:
    - test
  script:
    - python /opt/cover2cover.py target/site/jacoco/jacoco.xml src/main/groovy > target/site/coverage.xml
    - python /opt/source2filename.py target/site/coverage.xml
    - sed -i "s=<source>.*</source>=<source>./</source>=g" target/site/coverage.xml
  artifacts:
    paths:
      - target/site/coverage.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: target/site/coverage.xml
  coverage: /<coverage.*line-rate="(\d+.?\d*)/

package:
  stage: package
  needs:
    - test
  only:
    - develop
    - master
    - release/accelerator
  script:
    - mvn package
  artifacts:
    paths:
      - target/distribution

publish-maven:
  stage: publish
  needs:
    - test
    - package
  script:
    - 'mvn deploy -s src/main/assembly/ci_settings.xml'
  only:
    - master

publish-docker:
  stage: publish
  needs:
    - test
    - package
  image: docker:19.03.8
  only:
    - master
    - release/accelerator
  extends: .with-dind
  before_script:
    - export RELEASE_VERSION=${CI_COMMIT_BRANCH#*release/}
  script:
    - docker info
    - echo -n $CI_JOB_TOKEN | docker login -u gitlab-ci-token --password-stdin $CI_REGISTRY
    - docker pull $CI_REGISTRY_IMAGE:latest || true
    - docker build --tag $CI_REGISTRY_IMAGE:$RELEASE_VERSION .
    - docker push $CI_REGISTRY_IMAGE:$RELEASE_VERSION

.with-dind:
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: 1
    DOCKER_CERT_PATH: "/certs/client"
  services:
    - name: docker:19.03.8-dind
      command:
        - /bin/sh
        - -c
        - |
          echo "$CI_SERVER_TLS_CA_FILE" > /etc/ssl/certs/ca-cert-gitlab.pricefx.eu.crt || exit
          dockerd-entrypoint.sh || exit