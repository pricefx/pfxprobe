image: nixos/nix:latest

variables:
  DOCKER_REGISTRY_IMAGE: "index.docker.io/pricefx/pfxprobe"

stages:
  - build
  - publish

# =============================================================================
# REUSABLE DEFINITIONS
# =============================================================================

# Branch patterns for CI job filtering
.dev_branches: &dev_branches
  - merge_requests
  - release/accelerator
  - develop
  - master

.release_branches: &release_branches
  - develop
  - master

# Setup Nix with flakes enabled
.setup-nix:
  before_script:
    - echo "experimental-features = nix-command flakes" >> /etc/nix/nix.conf
    - nix --version

# Docker-in-Docker service configuration
.with-dind:
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: 1
    DOCKER_CERT_PATH: "/certs/client"
  services:
    - name: docker:24-dind
      command:
        - /bin/sh
        - -c
        - |
          echo "$CI_SERVER_TLS_CA_FILE" > /etc/ssl/certs/ca-cert-gitlab.pricefx.eu.crt || exit
          dockerd-entrypoint.sh || exit

# =============================================================================
# BUILD STAGE
# =============================================================================

test:
  stage: build
  extends: .setup-nix
  only: *dev_branches
  script:
    - nix develop --command nxtest
  artifacts:
    reports:
      junit:
        - ./target/surefire-reports/TEST-*.xml

package:
  stage: build
  extends:
    - .setup-nix
    - .with-dind
  only: *dev_branches
  before_script:
    - echo "experimental-features = nix-command flakes" >> /etc/nix/nix.conf
    - nix --version
    - |
      echo "Waiting for Docker to be ready..."
      for i in $(seq 1 30); do
        if docker info > /dev/null 2>&1; then
          echo "Docker is ready!"
          break
        fi
        echo "Docker not ready yet, waiting... ($i/30)"
        sleep 2
      done
  script:
    - nix develop --command nxpackage
  artifacts:
    paths:
      - build/result
      - build/result-docker

# =============================================================================
# PUBLISH STAGE
# =============================================================================

publish-maven:
  stage: publish
  extends: .setup-nix
  needs:
    - test
    - package
  only: *release_branches
  script:
    - nix develop --command nxpublish

push-private-image:
  stage: publish
  extends: .setup-nix
  needs:
    - test
    - package
  dependencies:
    - package
  only: *release_branches
  variables:
    DOCKER_REGISTRY: $CI_REGISTRY_IMAGE
    DOCKER_USER: gitlab-ci-token
    DOCKER_PASS: $CI_JOB_TOKEN
  script:
    - nix develop --command nxci-push

push-public-image:
  stage: publish
  extends: .setup-nix
  needs:
    - test
    - package
  dependencies:
    - package
  only: *release_branches
  variables:
    DOCKER_REGISTRY: $DOCKER_REGISTRY_IMAGE
    DOCKER_USER: pricefx
    DOCKER_PASS: $DOCKER_HUB_TOKEN
  script:
    - nix develop --command nxci-push
